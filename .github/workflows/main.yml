name: Deploy HTML Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy website
        run: |
          cp index.html /var/www/cvapp/index.html
          chmod 644 /var/www/cvapp/index.html

      - name: Show deployment status
        run: |
          echo "Website deployed successfully!"
          ls -l /var/www/cvapp/
